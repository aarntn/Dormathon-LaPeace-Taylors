# The real deployment: accounts and data in Supabase, emergency texts through Twilio.
# Use this instead of render.yaml by choosing it as the Blueprint file path in Render.
services:
  - type: web
    name: buckl
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Optional presentation mode: scripted dashboard and start-up results from the hidden demo panel.
      # Leave it out for real drivers.
      - key: DEMO_MODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
