# One-click demo of the whole BUCKL app on Render, with NO accounts or keys to set up.
#
# BUCKL_MODE=standalone runs the standalone demo server (backend/app/standalone.py): the app signs itself in
# as a ready-made demo driver, data lives in memory (it resets on restart), and emergency texts are
# SIMULATED (printed in the log, never sent). It refuses to start if Supabase or Twilio settings are present,
# so do not add them to this service. Anyone who can open the address can use the demo account, so keep real
# data out and suspend or delete the service after the presentation.
#
# For the real deployment (Supabase accounts, Twilio texts) use render.supabase.yaml instead.
services:
  - type: web
    name: buckl-demo
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BUCKL_MODE
        value: standalone
      - key: PYTHONUNBUFFERED
        value: "1"
